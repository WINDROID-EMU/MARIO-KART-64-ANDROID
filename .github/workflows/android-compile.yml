name: Android Build

on:
  push:
    branches: [ "*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip unzip tar curl pkg-config

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            build-android/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-android-arm64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-android-arm64-

      - name: Configure and Build Native Library (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DENABLE_VCPKG=ON \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DBUILD_MK64=ON \
            -DBUILD_NAUDIO=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build-android --target libSpaghettify.so --parallel $(nproc)

      - name: Copy Native Library to Android Project
        run: |
          mkdir -p android/app/libs/arm64-v8a
          cp build-android/libSpaghettify.so android/app/libs/arm64-v8a/libSpaghettify.so
          ls -lh android/app/libs/arm64-v8a/libSpaghettify.so

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarioKart64-Android-Debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
